name: release-artifacts

on:
  push:
    tags: ["spec-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r tools/requirements.txt
      - name: Verify specification contracts
        run: |
          python tools/spec_tool.py lint
          python tools/spec_tool.py verify-receiver-contract
          python tools/spec_tool.py verify-control-plane-contract
          python tools/spec_tool.py verify-apm-metrics-contract
          python tools/spec_tool.py breaking --against compatibility/baselines/semantic-registry-0.5.0-draft.0.json
          python tools/spec_tool.py breaking-apm-metrics --against compatibility/baselines/apm-metrics-1.1.0-draft.0.json
      - name: Verify tag matches VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "spec-v$(cat VERSION)"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Verify generated Go and TypeScript RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go generated/typescript-rutp)" ]; then
            git status --short -- generated/go generated/typescript-rutp
            exit 1
          fi
      - run: python tools/spec_tool.py generate --check
      - run: python tools/spec_tool.py verify-artifacts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify Go RUTP module
        working-directory: generated/go
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create release directory
        run: mkdir -p artifacts
      - name: Pack TypeScript semantic registry
        working-directory: generated/typescript
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Verify and pack TypeScript RUTP codec
        working-directory: generated/typescript-rutp
        shell: bash
        run: |
          npm install --ignore-scripts --no-package-lock
          npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck false index.d.ts
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { create } from "@bufbuild/protobuf"; import { ProtocolVersion, RumBatchSchema, SpecVersion, encodeRumBatch, decodeRumBatch } from "./index.js"; const packageVersion = JSON.parse(readFileSync("./package.json", "utf8")).version; const source = create(RumBatchSchema, { protocolVersion: ProtocolVersion, batchId: "release-check" }); const decoded = decodeRumBatch(encodeRumBatch(source)); if (SpecVersion !== packageVersion || decoded.protocolVersion !== ProtocolVersion || decoded.batchId !== source.batchId) process.exit(1)'
          npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack APM Metrics contract
        working-directory: generated/apm-metrics-contract
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack RUM conformance fixtures
        working-directory: generated/conformance
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - uses: dtolnay/rust-toolchain@stable
      - name: Pack Rust semantic registry
        working-directory: generated/rust/nebula-semantic-registry
        run: |
          cargo package --locked --allow-dirty --no-verify
          cp target/package/*.crate ../../../artifacts/
      - name: Archive fixture bundle
        run: |
          VERSION="$(cat VERSION)"
          cd generated/conformance
          zip -r "../../artifacts/rum-conformance-fixtures-${VERSION}.zip" .
      - name: Archive APM Metrics contract
        run: |
          VERSION="$(cat VERSION)"
          cd generated/apm-metrics-contract
          zip -r "../../artifacts/apm-metrics-contract-${VERSION}.zip" .
      - name: Archive Go RUTP module
        run: |
          VERSION="$(cat VERSION)"
          cd generated/go
          zip -r "../../artifacts/nebula-rutp-go-module-${VERSION}.zip" .
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: artifacts/*
      - name: Publish matching Go module tag
        shell: bash
        run: |
          GO_TAG="generated/go/v$(cat VERSION)"
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${GO_TAG}" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "${GO_TAG} already points to ${REMOTE_SHA}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ -z "$REMOTE_SHA" ]; then
            git tag "$GO_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${GO_TAG}"
          fi
