name: release-artifacts

on:
  push:
    tags: ["spec-v*"]

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r tools/requirements.txt
      - name: Test specification validator
        run: python -m unittest tools/test_spec_tool.py
      - name: Verify specification contracts
        run: |
          python tools/spec_tool.py lint
          python tools/spec_tool.py verify-receiver-contract
          python tools/spec_tool.py verify-control-plane-contract
          python tools/spec_tool.py verify-apm-metrics-contract
          python tools/spec_tool.py verify-apm-agent-contract
          python tools/spec_tool.py breaking --against compatibility/baselines/semantic-registry-0.5.0-draft.0.json
          python tools/spec_tool.py breaking-apm-metrics --against compatibility/baselines/apm-metrics-1.1.0-draft.0.json
      - name: Verify tag matches VERSION
        shell: bash
        env:
          REF_CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          test "${REF_CREATED}" = "true"
          test "${GITHUB_REF_NAME}" = "spec-v$(cat VERSION)"
          git fetch --no-tags origin +main:refs/remotes/origin/main
          remote_sha="$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${remote_sha}" ]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          fi
          test "${remote_sha}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Verify generated Go and TypeScript RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go generated/typescript-rutp)" ]; then
            git status --short -- generated/go generated/typescript-rutp
            exit 1
          fi
      - run: python tools/spec_tool.py generate --check
      - run: python tools/spec_tool.py verify-artifacts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify Go RUTP module
        working-directory: generated/go
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(cat VERSION)"
          manifest="$(cat releases/CURRENT)"
          cp "releases/${manifest}" "artifacts/platform-release-manifest-${version}.yaml"
      - name: Pack TypeScript semantic registry
        working-directory: generated/typescript
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Verify and pack TypeScript RUTP codec
        working-directory: generated/typescript-rutp
        shell: bash
        run: |
          npm install --ignore-scripts --no-package-lock
          npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck false index.d.ts
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { create } from "@bufbuild/protobuf"; import { ProtocolVersion, RumBatchSchema, SpecVersion, encodeRumBatch, decodeRumBatch } from "./index.js"; const packageVersion = JSON.parse(readFileSync("./package.json", "utf8")).version; const source = create(RumBatchSchema, { protocolVersion: ProtocolVersion, batchId: "release-check" }); const decoded = decodeRumBatch(encodeRumBatch(source)); if (SpecVersion !== packageVersion || decoded.protocolVersion !== ProtocolVersion || decoded.batchId !== source.batchId) process.exit(1)'
          npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack APM Metrics contract
        working-directory: generated/apm-metrics-contract
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack APM Agent contract
        working-directory: generated/apm-agent-contract
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack RUM conformance fixtures
        working-directory: generated/conformance
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - uses: dtolnay/rust-toolchain@stable
      - name: Pack Rust semantic registry
        working-directory: generated/rust/nebula-semantic-registry
        run: |
          cargo package --locked --allow-dirty --no-verify
          cp target/package/*.crate ../../../artifacts/
      - name: Archive reproducible release bundles
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          archive() {
            local source="$1"
            local output="$2"
            (
              cd "${source}"
              find . -type f -exec touch -t 198001010000 {} +
              LC_ALL=C find . -type f -print | LC_ALL=C sort | zip -X -q "../../artifacts/${output}" -@
            )
          }
          archive generated/conformance "rum-conformance-fixtures-${version}.zip"
          archive generated/apm-metrics-contract "apm-metrics-contract-${version}.zip"
          archive generated/apm-agent-contract "apm-agent-contract-${version}.zip"
          archive generated/go "nebula-rutp-go-module-${version}.zip"
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Verify every component Spec dependency is released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dependencies="${RUNNER_TEMP}/component-spec-releases"
          python - "${dependencies}" <<'PY'
          import pathlib
          import sys

          import yaml

          current = pathlib.Path("releases/CURRENT").read_text(encoding="utf-8").strip()
          manifest = yaml.safe_load(pathlib.Path("releases", current).read_text(encoding="utf-8"))
          releases = sorted(
              {
                  component["spec_dependency"]["release"]
                  for name, component in manifest["components"].items()
                  if name != "spec"
              }
          )
          pathlib.Path(sys.argv[1]).write_text("\n".join(releases) + "\n", encoding="utf-8")
          PY
          while IFS= read -r dependency; do
            git show-ref --verify --quiet "refs/tags/${dependency}"
            dependency_sha="$(git rev-parse "${dependency}^{commit}")"
            git merge-base --is-ancestor "${dependency_sha}" "${GITHUB_SHA}"
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${dependency}" \
              --jq '[.tag_name, .draft, .prerelease] | @tsv')" \
              == "$(printf '%s\tfalse\ttrue' "${dependency}")" ]]
          done < "${dependencies}"
      - name: Publish or verify matching Go module tag
        shell: bash
        run: |
          set -euo pipefail
          go_tag="generated/go/v$(cat VERSION)"
          remote_sha="$(git ls-remote --tags origin "refs/tags/${go_tag}" | awk 'NR == 1 { print $1 }')"
          if [[ -n "${remote_sha}" && "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "${go_tag} already points to ${remote_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -z "${remote_sha}" ]]; then
            git tag "${go_tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${go_tag}"
          fi
      - name: Publish or verify the server-immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases"
          response="${RUNNER_TEMP}/release.json"
          status="$(curl --silent --show-error \
            --output "${response}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "${status}" in
            200)
              python - "${response}" "${GITHUB_REF_NAME}" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              release.get("tag_name") != sys.argv[2]
              or release.get("draft")
              or not release.get("prerelease")
              or not release.get("immutable")
          ):
              raise SystemExit("existing release metadata differs from the immutable prerelease contract")
          PY
              mkdir "${RUNNER_TEMP}/existing-release"
              gh release download "${GITHUB_REF_NAME}" --dir "${RUNNER_TEMP}/existing-release"
              diff -u artifacts/SHA256SUMS "${RUNNER_TEMP}/existing-release/SHA256SUMS"
              diff -u \
                <(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
                <(find "${RUNNER_TEMP}/existing-release" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
              (cd "${RUNNER_TEMP}/existing-release" && sha256sum --check SHA256SUMS)
              exit 0
              ;;
            404) ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              exit 1
              ;;
          esac

          release_id=""
          release_verified=false
          cleanup() {
            local exit_status="$?"
            trap - EXIT
            if [[ -n "${release_id}" && "${release_verified}" != true ]]; then
              immutable="$(gh api "${release_endpoint}/${release_id}" --jq '.immutable' 2>/dev/null || true)"
              if [[ "${immutable}" == true ]]; then
                echo "The release became immutable; preserving it for an idempotent rerun." >&2
              else
                gh api --method DELETE "${release_endpoint}/${release_id}" >/dev/null || exit_status=1
              fi
            fi
            exit "${exit_status}"
          }
          trap cleanup EXIT

          marker="<!-- nebula-spec:${GITHUB_SHA} -->"
          draft_ids="$(gh api --paginate "${release_endpoint}?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft == true) | .id")"
          draft_count="$(sed '/^$/d' <<<"${draft_ids}" | wc -l | tr -d ' ')"
          [[ "${draft_count}" -le 1 ]] || {
            echo "Multiple drafts exist for ${GITHUB_REF_NAME}; refusing ambiguous recovery." >&2
            exit 1
          }
          if [[ "${draft_count}" == 1 ]]; then
            release_id="$(sed -n '1p' <<<"${draft_ids}")"
            draft_state="$(gh api "${release_endpoint}/${release_id}" \
              --jq '[.draft, .prerelease, .tag_name, .target_commitish] | @tsv')"
            expected_draft_state="$(printf 'true\ttrue\t%s\t%s' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA}")"
            [[ "${draft_state}" == "${expected_draft_state}" ]] || {
              echo "The existing draft is not owned by this release transaction." >&2
              exit 1
            }
            draft_body="$(gh api "${release_endpoint}/${release_id}" --jq '.body // ""')"
            case "${draft_body}" in
              *"${marker}"*) ;;
              *)
                echo "The existing draft lacks this release transaction marker." >&2
                exit 1
                ;;
            esac
            while IFS= read -r asset_id; do
              [[ -n "${asset_id}" ]] && gh api --method DELETE "${release_endpoint}/assets/${asset_id}" >/dev/null
            done < <(gh api --paginate "${release_endpoint}/${release_id}/assets?per_page=100" --jq '.[].id')
          else
            release_id="$(gh api --method POST "${release_endpoint}" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="${GITHUB_REF_NAME}" \
              -f body="${marker}" \
              -f make_latest=false \
              -F draft=true \
              -F prerelease=true \
              -F generate_release_notes=true \
              --jq '.id')"
          fi
          upload_url="$(gh api "${release_endpoint}/${release_id}" --jq '.upload_url' | sed 's/{.*$//')"
          for asset in artifacts/*; do
            asset_name="$(basename "${asset}")"
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "${asset}" \
              "${upload_url}?name=${asset_name}" >/dev/null
          done

          expected_assets="$(for asset in artifacts/*; do
            printf '%s\tsha256:%s\n' "$(basename "${asset}")" "$(sha256sum "${asset}" | cut -d ' ' -f 1)"
          done | LC_ALL=C sort)"
          actual_assets="$(gh api "${release_endpoint}/${release_id}" --jq '.assets[] | [.name, .digest] | @tsv' | LC_ALL=C sort)"
          [[ "${actual_assets}" == "${expected_assets}" ]]

          immutable="$(gh api --method PATCH "${release_endpoint}/${release_id}" -F draft=false --jq '.immutable')"
          [[ "${immutable}" == true ]] || {
            echo "The repository did not enforce immutable releases; refusing to publish mutable assets." >&2
            exit 1
          }
          [[ "$(gh api "${release_endpoint}/${release_id}" --jq '[.draft, .prerelease, .immutable, .tag_name] | @tsv')" \
            == "$(printf 'false\ttrue\ttrue\t%s' "${GITHUB_REF_NAME}")" ]]
          release_verified=true
          trap - EXIT
