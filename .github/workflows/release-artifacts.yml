name: release-artifacts

on:
  push:
    tags: ["spec-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r tools/requirements.txt
      - name: Test specification validator
        run: python -m unittest tools/test_spec_tool.py
      - name: Verify specification contracts
        run: |
          python tools/spec_tool.py lint
          python tools/spec_tool.py verify-receiver-contract
          python tools/spec_tool.py verify-control-plane-contract
          python tools/spec_tool.py verify-apm-metrics-contract
          python tools/spec_tool.py verify-apm-agent-contract
          python tools/spec_tool.py breaking --against compatibility/baselines/semantic-registry-0.5.0-draft.0.json
          python tools/spec_tool.py breaking-apm-metrics --against compatibility/baselines/apm-metrics-1.1.0-draft.0.json
      - name: Verify tag matches VERSION
        shell: bash
        env:
          REF_CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          test "${REF_CREATED}" = "true"
          test "${GITHUB_REF_NAME}" = "spec-v$(cat VERSION)"
          git fetch --no-tags origin +main:refs/remotes/origin/main
          remote_sha="$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${remote_sha}" ]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          fi
          test "${remote_sha}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Verify generated Go and TypeScript RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go generated/typescript-rutp)" ]; then
            git status --short -- generated/go generated/typescript-rutp
            exit 1
          fi
      - run: python tools/spec_tool.py generate --check
      - run: python tools/spec_tool.py verify-artifacts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify Go RUTP module
        working-directory: generated/go
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create release directory
        run: mkdir -p artifacts
      - name: Pack TypeScript semantic registry
        working-directory: generated/typescript
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Verify and pack TypeScript RUTP codec
        working-directory: generated/typescript-rutp
        shell: bash
        run: |
          npm install --ignore-scripts --no-package-lock
          npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck false index.d.ts
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { create } from "@bufbuild/protobuf"; import { ProtocolVersion, RumBatchSchema, SpecVersion, encodeRumBatch, decodeRumBatch } from "./index.js"; const packageVersion = JSON.parse(readFileSync("./package.json", "utf8")).version; const source = create(RumBatchSchema, { protocolVersion: ProtocolVersion, batchId: "release-check" }); const decoded = decodeRumBatch(encodeRumBatch(source)); if (SpecVersion !== packageVersion || decoded.protocolVersion !== ProtocolVersion || decoded.batchId !== source.batchId) process.exit(1)'
          npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack APM Metrics contract
        working-directory: generated/apm-metrics-contract
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack APM Agent contract
        working-directory: generated/apm-agent-contract
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Pack RUM conformance fixtures
        working-directory: generated/conformance
        run: npm pack --ignore-scripts --pack-destination ../../artifacts
      - uses: dtolnay/rust-toolchain@stable
      - name: Pack Rust semantic registry
        working-directory: generated/rust/nebula-semantic-registry
        run: |
          cargo package --locked --allow-dirty --no-verify
          cp target/package/*.crate ../../../artifacts/
      - name: Archive reproducible release bundles
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          archive() {
            local source="$1"
            local output="$2"
            (
              cd "${source}"
              find . -type f -exec touch -t 198001010000 {} +
              LC_ALL=C find . -type f -print | LC_ALL=C sort | zip -X -q "../../artifacts/${output}" -@
            )
          }
          archive generated/conformance "rum-conformance-fixtures-${version}.zip"
          archive generated/apm-metrics-contract "apm-metrics-contract-${version}.zip"
          archive generated/apm-agent-contract "apm-agent-contract-${version}.zip"
          archive generated/go "nebula-rutp-go-module-${version}.zip"
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Verify immutable release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/release.json"
          status="$(curl --silent --show-error \
            --output "${response}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "${status}" in
            404)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              ;;
            200)
              python - "${response}" "${GITHUB_REF_NAME}" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("tag_name") != sys.argv[2] or release.get("draft") or not release.get("prerelease"):
              raise SystemExit("existing release metadata differs from the immutable prerelease contract")
          PY
              mkdir "${RUNNER_TEMP}/existing-release"
              gh release download "${GITHUB_REF_NAME}" --dir "${RUNNER_TEMP}/existing-release"
              diff -u artifacts/SHA256SUMS "${RUNNER_TEMP}/existing-release/SHA256SUMS"
              diff -u \
                <(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
                <(find "${RUNNER_TEMP}/existing-release" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
              (cd "${RUNNER_TEMP}/existing-release" && sha256sum --check SHA256SUMS)
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              exit 1
              ;;
          esac
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.release-state.outputs.exists != 'true'
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          overwrite_files: false
          files: artifacts/*
      - name: Publish matching Go module tag
        shell: bash
        run: |
          GO_TAG="generated/go/v$(cat VERSION)"
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${GO_TAG}" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "${GO_TAG} already points to ${REMOTE_SHA}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ -z "$REMOTE_SHA" ]; then
            git tag "$GO_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${GO_TAG}"
          fi
