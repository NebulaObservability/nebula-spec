name: repository-baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify specification baseline
        shell: pwsh
        run: ./tools/verify-baseline.ps1
