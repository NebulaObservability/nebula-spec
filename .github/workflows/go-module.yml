name: go-module

on:
  push:
    tags: ["generated/go/v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify module tag matches VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "generated/go/v$(cat VERSION)"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Verify generated RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go)" ]; then
            git status --short -- generated/go
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Test Go module
        working-directory: generated/go
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
