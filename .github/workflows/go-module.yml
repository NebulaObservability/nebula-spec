name: go-module

on:
  push:
    tags: ["generated/go/v*"]

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify immutable workflow actions
        run: ruby tools/verify-action-pins.rb
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install specification validation dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify specification and RUTP Receiver contract
        run: |
          python tools/spec_tool.py lint
          python tools/spec_tool.py verify-receiver-contract
          python tools/spec_tool.py generate --check
      - name: Verify module tag matches VERSION
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "generated/go/v$(cat VERSION)"
          merged_pr_number="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
            --jq '[.[] | select(.state == "closed" and .merged_at != null and .merge_commit_sha == env.GITHUB_SHA and .base.ref == "main" and .base.repo.full_name == env.GITHUB_REPOSITORY)] | select(length == 1) | .[0].number')"
          [[ "${merged_pr_number}" =~ ^[1-9][0-9]*$ ]]
          gh pr checks "${merged_pr_number}" --repo "${GITHUB_REPOSITORY}"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
      - name: Verify generated RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go generated/typescript-rutp)" ]; then
            git status --short -- generated/go generated/typescript-rutp
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: false
      - name: Test Go module
        working-directory: generated/go
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
