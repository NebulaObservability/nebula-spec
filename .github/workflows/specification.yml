name: specification

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Lint registries and fixtures
        run: python tools/spec_tool.py lint
      - name: Verify RUTP Receiver conformance
        run: python tools/spec_tool.py verify-receiver-contract
      - name: Verify generated artifacts
        run: python tools/spec_tool.py generate --check
      - name: Verify distributable artifacts
        run: python tools/spec_tool.py verify-artifacts
      - name: Check semantic compatibility
        run: python tools/spec_tool.py breaking --against compatibility/baselines/semantic-registry-0.2.0-draft.0.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Lint Protobuf
        run: buf lint
      - name: Compile Protobuf
        run: buf build
      - name: Check Protobuf compatibility
        run: buf breaking --against compatibility/baselines/rutp-v1.binpb
      - name: Verify generated Go and TypeScript RUTP Protobuf sources
        shell: bash
        run: |
          buf generate --template buf.gen.yaml
          if [ -n "$(git status --porcelain -- generated/go generated/typescript-rutp)" ]; then
            git status --short -- generated/go generated/typescript-rutp
            exit 1
          fi
      - name: Compile generated Java registry
        run: javac -d "${{ runner.temp }}/java-classes" generated/java/io/nebulaobservability/semantic/NebulaSemanticRegistry.java
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check generated TypeScript registry
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2020 generated/typescript/registry.ts
      - name: Import generated TypeScript package
        run: node --input-type=module -e "import('./generated/typescript/registry.js').then(({Attributes}) => { if (!Attributes.RumViewId) process.exit(1) })"
      - name: Verify generated TypeScript RUTP codec
        working-directory: generated/typescript-rutp
        shell: bash
        run: |
          npm install --ignore-scripts --no-package-lock
          npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck false index.d.ts
          node --input-type=module -e 'import { create } from "@bufbuild/protobuf"; import { RumBatchSchema, encodeRumBatch, decodeRumBatch } from "./index.js"; const source = create(RumBatchSchema, { protocolVersion: "1.0.0-draft.1", batchId: "codec-check" }); const decoded = decodeRumBatch(encodeRumBatch(source)); if (decoded.batchId !== source.batchId) process.exit(1)'
      - name: Verify TypeScript packages are packable
        shell: bash
        run: |
          (cd generated/typescript && npm pack --dry-run --ignore-scripts)
          (cd generated/typescript-rutp && npm pack --dry-run --ignore-scripts)
          (cd generated/conformance && npm pack --dry-run --ignore-scripts)
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and package generated Rust registry
        shell: bash
        run: |
          cargo test --manifest-path generated/rust/nebula-semantic-registry/Cargo.toml --locked
          cargo package --manifest-path generated/rust/nebula-semantic-registry/Cargo.toml --locked --allow-dirty --no-verify
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify generated Go formatting and syntax
        shell: bash
        working-directory: generated/go
        run: |
          test -z "$(gofmt -d $(find . -name '*.go' -type f))"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
